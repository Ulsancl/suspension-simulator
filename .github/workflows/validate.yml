name: Validate Suspension Lab

on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['transmission-lab/**', 'output/**', 'release/**']
  pull_request:
    paths-ignore: ['transmission-lab/**', 'output/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suspension-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      CI: 'true'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies and runtimes
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify model and experiment data
        run: npm test
      - name: Build web bundle
        run: npm run build
      - name: Verify web workflows
        run: node scripts/verify-web.mjs
      - name: Verify source desktop app
        timeout-minutes: 10
        run: npm run test:desktop
      - name: Package Windows installer
        run: npm run package:desktop
      - name: Verify independent desktop executable
        timeout-minutes: 10
        run: |
          $env:SUSPENSION_DESKTOP_EXE = Join-Path $env:GITHUB_WORKSPACE 'release/windows/win-unpacked/Suspension Lab.exe'
          node tests/desktop.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installer checksum and notices
        run: |
          $taskVersion = (Get-Content -Raw -LiteralPath 'package.json' | ConvertFrom-Json).version
          $taskInstaller = "release/windows/Suspension-Lab-Setup-$taskVersion.exe"
          $taskExpectedHash = (Get-Content -Raw -LiteralPath "$taskInstaller.sha256").Trim().Split(' ')[0]
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $taskInstaller).Hash -ne $taskExpectedHash) { throw 'Installer checksum mismatch' }
          foreach ($taskNotice in @('LICENSE.electron.txt', 'LICENSES.chromium.html', 'resources/THREE-LICENSE.txt', 'resources/docs/THIRD-PARTY-NOTICES.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path 'release/windows/win-unpacked' $taskNotice))) { throw "Missing notice: $taskNotice" }
          }
      - name: Retain tested installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suspension-lab-windows-${{ github.sha }}
          path: |
            release/windows/Suspension-Lab-Setup-*.exe
            release/windows/Suspension-Lab-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Retain desktop verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: suspension-desktop-verification-${{ github.sha }}
          path: |
            output/browser/*.json
            output/browser/*.png
            output/desktop*/report.json
            output/detail-browser/*.json
            output/detail-browser/*.png
            output/desktop*/installed-report.json
            output/desktop*/failure.json
            output/desktop*/failure-state.json
            output/desktop*/progress.jsonl
            output/desktop*/failure.png
            output/desktop*/desktop*.log
            output/desktop*/profile-*/desktop.log
          if-no-files-found: warn
          retention-days: 14
